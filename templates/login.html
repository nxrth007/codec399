<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: one black field. The word types itself in; the form surfaces beneath it once it has. */
  :root {
    --bg:#000; --fg:#f4f4f4; --dim:#6b6b6b; --faint:#2b2b2b; --field:#0d0d0d; --err:#ff5f5f;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 var(--mono);
    display:grid; place-items:center;
    padding-block:24px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  .ghost { width:min(100%, 360px); display:grid; gap:32px; }
  .logo { width:min(60%, 200px); height:auto; display:block; justify-self:center; opacity:0; animation:fade .8s ease-out .1s forwards; }
  .discord { justify-self:center; margin-top:-14px; display:inline-flex; align-items:center; gap:9px; color:var(--dim); text-decoration:none;
    font-size:12px; letter-spacing:.12em; text-transform:uppercase; padding:8px 14px; border:1px solid var(--faint); border-radius:999px;
    opacity:0; animation:fade .8s ease-out .4s forwards; transition:color .15s, border-color .15s; }
  .discord svg { width:18px; height:18px; fill:currentColor; display:block; }
  .discord:hover, .discord:focus-visible { color:#5865F2; border-color:#5865F2; outline:none; }
  .wordmark { font-weight:200; font-size:clamp(44px, 10vw, 72px); line-height:1; letter-spacing:.08em; white-space:nowrap; }
  .typed { display:inline-block; overflow:hidden; vertical-align:bottom; width:0; animation:type 1.1s steps(5, end) .5s forwards; }
  .caret { display:inline-block; width:.07em; height:.95em; background:var(--fg); margin-left:.06em; vertical-align:-.02em; animation:blink 1.05s steps(1) infinite; }
  form { display:grid; gap:22px; opacity:0; transform:translateY(8px); animation:rise .7s ease-out 1.6s forwards; }
  .field { display:grid; gap:6px; }
  label { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  input {
    width:100%; background:var(--field); color:var(--fg); border:0; border-bottom:1px solid var(--faint);
    padding:10px 2px; font:inherit; outline:none; border-radius:0; transition:border-color .15s;
  }
  input:focus { border-bottom-color:var(--fg); }
  input:-webkit-autofill { -webkit-box-shadow:0 0 0 100px var(--field) inset; -webkit-text-fill-color:var(--fg); }
  .actions { display:flex; gap:12px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  button {
    font:inherit; letter-spacing:.06em; padding:11px 22px; border-radius:2px; cursor:pointer;
    border:1px solid var(--fg); background:var(--fg); color:var(--bg); transition:opacity .15s;
  }
  button:hover { opacity:.86; }
  button:focus-visible { outline:2px solid var(--fg); outline-offset:3px; }
  a.secondary { font:inherit; letter-spacing:.06em; padding:11px 22px; border-radius:2px; text-decoration:none; display:inline-block;
    background:transparent; color:var(--dim); border:1px solid var(--faint); transition:color .15s, border-color .15s; }
  a.secondary:hover { color:var(--fg); border-color:var(--dim); }
  a.secondary:focus-visible { outline:2px solid var(--fg); outline-offset:3px; }
  .error { color:var(--err); font-size:13px; }
  .foot { color:var(--dim); font-size:12px; letter-spacing:.04em; }
  @keyframes type { to { width:calc(5ch + .4em); } }
  @keyframes fade { to { opacity:1; } }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes rise { to { opacity:1; transform:none; } }
  /* Settled state: reached by the animations, by reduced-motion, or by the timeout below if an
     animation never runs, so the form is always there within a few seconds. */
  .settled .typed { width:calc(5ch + .4em); animation:none; }
  .settled .logo, .settled .discord { opacity:1; animation:none; }
  .settled form { opacity:1; transform:none; animation:none; }
  @media (prefers-reduced-motion: reduce) {
    .typed { width:auto; animation:none; }
    .caret { animation:none; }
    .logo, .discord { opacity:1; animation:none; }
    form { opacity:1; transform:none; animation:none; }
  }
</style>
</head>
<body>
<main class="ghost">
  <img class="logo" src="/static/logo.webp" alt="GhostRus">
  <a class="discord" href="https://discord.gg/peEY87MCu" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
    Join the Discord
  </a>
  <h1 class="wordmark" aria-label="Ghost"><span class="typed" aria-hidden="true">Ghost</span><span class="caret" aria-hidden="true"></span></h1>
  <form method="post" action="/login{% if next %}?next={{ next|urlencode }}{% endif %}" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus value="{{ email or '' }}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <div class="actions">
      <button type="submit">Sign in</button>
      <a class="secondary" id="register" href="/register">Register</a>
    </div>
  </form>
</main>
<script>
  setTimeout(() => document.body.classList.add('settled'), 3200);
  document.querySelector('form').addEventListener('animationend', () => document.body.classList.add('settled'));
</script>
</body>
</html>
