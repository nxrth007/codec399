<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost</title>
<meta name="description" content="Ghost Marketing: specialized ad creatives. Press Start to join the Discord.">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="Ghost">
<meta property="og:description" content="Specialized ad creatives. Press Start.">
<meta property="og:image" content="{{ site }}/static/logo.webp">
<meta property="og:url" content="{{ canonical }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* The sign-in page's black field and typed wordmark, dressed as a title screen: a drifting
     starfield, faint scanlines, a HUD in the corners, and one thing to do: press Start. */
  :root {
    --bg:#000; --fg:#f4f4f4; --dim:#6b6b6b; --faint:#2b2b2b; --glow:#f4f4f4; --accent:#5865F2;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 var(--mono);
    display:grid; place-items:center; overflow:hidden; position:relative;
    padding-block:72px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  canvas.stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .scan { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.55) 2px 3px); }
  .vignette { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%); }
  .hud { position:fixed; z-index:2; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim);
    padding:calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; opacity:0; animation:fade .8s ease-out 2.2s forwards; }
  .hud.tl { top:0; left:0; } .hud.tr { top:0; right:0; text-align:right; }
  .hud.bl { bottom:0; left:0; top:auto; padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
  .hud.br { bottom:0; right:0; top:auto; text-align:right; padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
  .hud b { color:var(--fg); font-weight:500; }
  .hud .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#3ddc84; margin-right:8px; vertical-align:1px; box-shadow:0 0 8px #3ddc84; animation:pulse 2s ease-in-out infinite; }

  .ghost { position:relative; z-index:2; width:min(100%, 420px); display:grid; gap:34px; justify-items:center; text-align:center; }
  .logo { width:min(58%, 210px); height:auto; display:block; opacity:0; animation:fade .9s ease-out .1s forwards;
    filter:drop-shadow(0 0 24px rgba(244,244,244,.18)); }
  .wordmark { margin:0; font-weight:200; font-size:clamp(52px, 12vw, 84px); line-height:1; letter-spacing:.1em; white-space:nowrap;
    text-shadow:0 0 18px rgba(244,244,244,.25); }
  .typed { display:inline-block; overflow:hidden; vertical-align:bottom; width:0; animation:type 1.1s steps(5, end) .5s forwards; }
  .caret { display:inline-block; width:.07em; height:.95em; background:var(--fg); margin-left:.06em; vertical-align:-.02em; animation:blink 1.05s steps(1) infinite; }
  .tag { margin:-18px 0 0; color:var(--dim); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:0; animation:fade .8s ease-out 1.7s forwards; }

  .press { display:grid; gap:14px; justify-items:center; opacity:0; transform:translateY(8px); animation:rise .7s ease-out 1.9s forwards; }
  .prompt { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); animation:blink 1.2s steps(1) infinite; }
  .start {
    font:inherit; font-weight:700; font-size:clamp(18px, 3.6vw, 22px); letter-spacing:.32em; text-transform:uppercase; text-indent:.32em;
    padding:18px 54px; min-width:min(100%, 280px); border-radius:4px; cursor:pointer; text-decoration:none; display:inline-block;
    border:1px solid var(--fg); background:var(--fg); color:var(--bg);
    box-shadow:0 0 0 0 rgba(244,244,244,.0), 0 0 34px rgba(244,244,244,.18);
    transition:transform .12s ease, box-shadow .2s ease, background .2s, color .2s, border-color .2s;
  }
  .start:hover, .start:focus-visible { transform:translateY(-2px); box-shadow:0 0 0 3px rgba(244,244,244,.12), 0 0 48px rgba(244,244,244,.32); outline:none; }
  .start:active { transform:translateY(1px) scale(.99); }
  .start.go { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 3px rgba(88,101,242,.25), 0 0 60px rgba(88,101,242,.6); }
  .hint { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .hint kbd { font:inherit; color:var(--dim); border:1px solid var(--faint); border-radius:3px; padding:1px 6px; }

  @keyframes type { to { width:calc(5ch + .4em); } }
  @keyframes fade { to { opacity:1; } }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes rise { to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { opacity:.35; } }
  .settled .typed { width:calc(5ch + .4em); animation:none; }
  .settled .logo, .settled .tag, .settled .hud { opacity:1; animation:none; }
  .settled .press { opacity:1; transform:none; animation:none; }
  @media (prefers-reduced-motion: reduce) {
    .typed { width:auto; animation:none; }
    .caret, .prompt, .hud .dot { animation:none; }
    .logo, .tag, .hud { opacity:1; animation:none; }
    .press { opacity:1; transform:none; animation:none; }
    canvas.stars { display:none; }
  }
  @media (max-width: 480px) {
    .hud.tr, .hud.bl { display:none; }
    body { padding-block:64px; }
  }
</style>
</head>
<body>
<canvas class="stars" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="hud tl" aria-hidden="true"><span class="dot"></span>Player 1 <b>ready</b></div>
<div class="hud tr" aria-hidden="true">Ghost Marketing</div>
<div class="hud bl" aria-hidden="true">Stage <b>01</b> · Specialized ads</div>
<div class="hud br" aria-hidden="true">Insert coin: <b>none</b></div>

<main class="ghost">
  <img class="logo" src="/static/logo.webp" alt="GhostRus" width="640" height="640">
  <h1 class="wordmark" aria-label="Ghost"><span class="typed" aria-hidden="true">Ghost</span><span class="caret" aria-hidden="true"></span></h1>
  <p class="tag">Specialized ads · Press start to play</p>
  <div class="press">
    <div class="prompt" aria-hidden="true">Press start</div>
    <a class="start" id="start" href="{{ discord }}" rel="noopener">Start</a>
    <div class="hint">or press <kbd>Enter</kbd></div>
  </div>
</main>

<script>
  // Settle the intro after a few seconds whatever happens to the animations.
  setTimeout(() => document.body.classList.add('settled'), 3200);
  document.querySelector('.press').addEventListener('animationend', () => document.body.classList.add('settled'));

  // Press Start: the button, or Enter / Space anywhere on the page.
  const start = document.getElementById('start');
  let going = false;
  function go(e) {
    if (going) return;
    going = true;
    if (e) e.preventDefault();
    start.classList.add('go');
    start.textContent = 'Loading…';
    setTimeout(() => { location.href = start.href; }, 420);
  }
  start.addEventListener('click', go);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') go(e); });

  // Starfield: a few hundred dots drifting toward the viewer. Skipped when motion is reduced.
  const canvas = document.querySelector('canvas.stars');
  if (canvas && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    const N = 220;
    function resize() {
      w = canvas.width = innerWidth * devicePixelRatio;
      h = canvas.height = innerHeight * devicePixelRatio;
      stars = Array.from({ length: N }, () => ({ x: (Math.random() - .5) * w, y: (Math.random() - .5) * h, z: Math.random() * w }));
    }
    function frame() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
      const speed = going ? 18 : 1.2;
      for (const s of stars) {
        s.z -= speed * devicePixelRatio;
        if (s.z <= 1) { s.x = (Math.random() - .5) * w; s.y = (Math.random() - .5) * h; s.z = w; }
        const k = 160 * devicePixelRatio / s.z;
        const x = s.x * k + w / 2, y = s.y * k + h / 2;
        if (x < 0 || x >= w || y < 0 || y >= h) continue;
        const size = Math.max(.5, (1 - s.z / w) * 2.2) * devicePixelRatio;
        ctx.fillStyle = 'rgba(244,244,244,' + (0.25 + (1 - s.z / w) * 0.7).toFixed(2) + ')';
        ctx.fillRect(x, y, size, size);
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', resize);
    resize();
    frame();
  }
</script>
</body>
</html>
