# codec399 reverse proxy. install.sh copies this to /etc/nginx/sites-available/codec399
# with the server_name filled in. certbot --nginx adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploads up to 16 GB, streamed straight to the app rather than spooled to disk.
    client_max_body_size 16g;
    client_body_timeout 600s;
    proxy_request_buffering off;
    # Downloads stream straight back to the client.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:5399;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
